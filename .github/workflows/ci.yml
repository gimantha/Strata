name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate from AGENTS.md section 33: formatting, vet, tests, and race tests. Integration
# tests run against a real PostgreSQL service rather than a mock, because the behavior
# under test is transactional.
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's image is the stock postgres:16 with the extension available. It is
        # used from the start so the vector projection in phase 6 needs no CI change, and
        # so nobody discovers the extension is missing halfway through building it. The
        # extension is not enabled here; a migration will enable it when it is needed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Turn a missing database into a failure: integration coverage must not vanish
      # silently if the service container fails to start.
      CG_REQUIRE_PG: "1"
      TEST_NATS_URL: nats://127.0.0.1:4222
      # The same rule for the bus: no NATS server means a failed build, not a quiet loss
      # of the distributed coverage.
      CG_REQUIRE_NATS: "1"
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: strata
      TEST_S3_SECRET_KEY: strata-secret
      # And for the object store, so the S3 adapter is verified against a real
      # implementation rather than skipped.
      CG_REQUIRE_S3: "1"
      TEST_QDRANT_HOST: 127.0.0.1
      TEST_QDRANT_PORT: "6334"
      # And the vector backend. A conformance suite the second implementation never runs
      # proves nothing about the port, so a missing Qdrant fails the build.
      CG_REQUIRE_QDRANT: "1"
      TEST_OPENSEARCH_URL: http://127.0.0.1:9200
      # And the lexical backend, for the same reason.
      CG_REQUIRE_OPENSEARCH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Not a service container: JetStream needs the -js argument, and a service block
      # can set image, ports, and env but not the command. A plain NATS server accepts
      # connections and then fails every stream operation — the same trap as a PostgreSQL
      # server without pgvector — so it has to be started properly or not at all.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name strata-ci-nats -p 4222:4222 nats:2.10-alpine -js
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              echo "NATS is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "NATS never became reachable" >&2
          docker logs strata-ci-nats >&2
          exit 1

      # Also not a service container: MinIO needs the `server /data` command, which a
      # service block cannot set. Tested against MinIO rather than AWS because the adapter
      # claims S3 compatibility, and a compatibility claim tested only against S3 is
      # untested.
      - name: Start MinIO
        run: |
          docker run -d --name strata-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=strata -e MINIO_ROOT_PASSWORD=strata-secret \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then
              echo "MinIO is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO never became reachable" >&2
          docker logs strata-ci-minio >&2
          exit 1

      # A service container would do here — Qdrant needs no command — but it is started
      # the same way as the others so one pattern covers all three.
      - name: Start Qdrant
        run: |
          docker run -d --name strata-ci-qdrant -p 6333:6333 -p 6334:6334 qdrant/qdrant:latest
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6334) 2>/dev/null; then
              echo "Qdrant is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant never became reachable" >&2
          docker logs strata-ci-qdrant >&2
          exit 1

      # A JVM, so it gets a longer wait than the others and a small heap. Security plugin
      # off because this is a test fixture reachable only from the runner.
      - name: Start OpenSearch
        run: |
          docker run -d --name strata-ci-opensearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" \
            opensearchproject/opensearch:2
          for _ in $(seq 1 60); do
            if [ "$(curl -s -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:9200/ || true)" = "200" ]; then
              echo "OpenSearch is ready"
              exit 0
            fi
            sleep 2
          done
          echo "OpenSearch never became ready" >&2
          docker logs strata-ci-opensearch 2>&1 | tail -20 >&2
          exit 1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check domain package isolation
        run: ./scripts/check-domain-deps.sh

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...
