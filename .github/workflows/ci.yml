name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate from AGENTS.md section 33: formatting, vet, tests, and race tests. Integration
# tests run against a real PostgreSQL service rather than a mock, because the behavior
# under test is transactional.
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's image is the stock postgres:16 with the extension available. It is
        # used from the start so the vector projection in phase 6 needs no CI change, and
        # so nobody discovers the extension is missing halfway through building it. The
        # extension is not enabled here; a migration will enable it when it is needed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Turn a missing database into a failure: integration coverage must not vanish
      # silently if the service container fails to start.
      CG_REQUIRE_PG: "1"
      TEST_NATS_URL: nats://127.0.0.1:4222
      # The same rule for the bus: no NATS server means a failed build, not a quiet loss
      # of the distributed coverage.
      CG_REQUIRE_NATS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Not a service container: JetStream needs the -js argument, and a service block
      # can set image, ports, and env but not the command. A plain NATS server accepts
      # connections and then fails every stream operation — the same trap as a PostgreSQL
      # server without pgvector — so it has to be started properly or not at all.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name strata-ci-nats -p 4222:4222 nats:2.10-alpine -js
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              echo "NATS is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "NATS never became reachable" >&2
          docker logs strata-ci-nats >&2
          exit 1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check domain package isolation
        run: ./scripts/check-domain-deps.sh

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...
